name: Release

on:
  release:
    types: [published]

permissions: {}

jobs:
  publish:
    name: Publish image and chart
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          cache: false

      - name: Log in to the container registry
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          echo "$GITHUB_TOKEN" | ko login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          echo "$GITHUB_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Publish the operator image
        env:
          KO_DOCKER_REPO: ghcr.io/${{ github.repository_owner }}/kupra-operator
        run: ko build --bare --tags "${TAG#v}" --image-label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" ./cmd/operator

      - name: Publish the chart
        run: |
          helm package charts/kupra --version "${TAG#v}" --app-version "${TAG#v}" --destination "$RUNNER_TEMP"
          helm push "$RUNNER_TEMP/kupra-${TAG#v}.tgz" "oci://ghcr.io/$GITHUB_REPOSITORY_OWNER/charts"
