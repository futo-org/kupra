version: '2'

run:
  build-tags:
    - integration
    - e2e

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - goimports

linters:
  enable:
    - depguard
    - errorlint
    - forbidigo
    - revive
  exclusions:
    rules:
      # Tests poll with sleeps, and print errors as values in their failure messages.
      - path: _test\.go$
        linters: [errorlint, forbidigo]
  settings:
    revive:
      rules:
        # CONTRIBUTING's "Prose in code": messages are lowercase and have no trailing period.
        - name: error-strings
    forbidigo:
      forbid:
        - pattern: ^time\.Sleep$
          msg: requeue instead of blocking a worker
        - pattern: ^fmt\.Print
          msg: log with the context's logger
    depguard:
      rules:
        # State kinds, rendering and naming don't talk to the API server (ADR 2): only the controllers do. They may log.
        functional-core:
          files:
            - "**/internal/state/*.go"
            - "**/internal/render/*.go"
            - "**/internal/names/*.go"
            - "!$test"
          deny:
            - pkg: sigs.k8s.io/controller-runtime/pkg/client
              desc: only the controllers talk to the API server
            - pkg: sigs.k8s.io/controller-runtime/pkg/cache
              desc: only the controllers talk to the API server
            - pkg: k8s.io/client-go
              desc: only the controllers talk to the API server
        # The dashboard faces the web, so it holds none of the operator's permissions or code (ADR 7).
        dashboard:
          files:
            - "**/internal/dashboard/*.go"
            - "**/cmd/dashboard/*.go"
          deny:
            - pkg: github.com/futo-org/kupra/internal/controller
              desc: the dashboard acts only as its users, through the API
            - pkg: github.com/futo-org/kupra/internal/state
              desc: the dashboard acts only as its users, through the API
            - pkg: github.com/futo-org/kupra/internal/render
              desc: the dashboard acts only as its users, through the API
