{{- /* files/role.yaml is generated by controller-gen, with kupra-system standing in for the release's namespace. */}}
{{- range $doc := regexSplit "(?m)^---$" (.Files.Get "files/role.yaml") -1 }}
{{- $obj := fromYaml $doc }}
{{- if $obj }}
{{- if eq (dig "namespace" "" $obj.metadata) "kupra-system" }}
{{- $_ := set $obj.metadata "namespace" $.Release.Namespace }}
{{- end }}
---
{{ toYaml $obj }}
{{- end }}
{{- end }}
