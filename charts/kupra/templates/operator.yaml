apiVersion: v1
kind: ServiceAccount
metadata:
  name: kupra-operator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kupra.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kupra-operator
  labels:
    {{- include "kupra.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kupra-operator
subjects:
  - kind: ServiceAccount
    name: kupra-operator
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kupra-operator-bind
  labels:
    {{- include "kupra.clusterRoleLabels" . | nindent 4 }}
aggregationRule:
  clusterRoleSelectors:
    - matchLabels:
        kupra.futo.tech/aggregate-to-operator: "true"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kupra-operator-bind-base
  labels:
    {{- include "kupra.labelsWith" (dict "ctx" . "labels" (dict "kupra.futo.tech/aggregate-to-operator" "true") "noCommon" true) | nindent 4 }}
rules:
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterroles]
    verbs: [bind]
    resourceNames: [kupra-preview-template, kupra-preview-access]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kupra-operator-bind
  labels:
    {{- include "kupra.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kupra-operator-bind
subjects:
  - kind: ServiceAccount
    name: kupra-operator
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kupra-operator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kupra.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kupra-operator
subjects:
  - kind: ServiceAccount
    name: kupra-operator
    namespace: {{ .Release.Namespace }}
