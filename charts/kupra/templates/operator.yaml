apiVersion: v1
kind: ServiceAccount
metadata:
  name: kupra-operator
  namespace: kupra-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kupra-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kupra-operator
subjects:
  - kind: ServiceAccount
    name: kupra-operator
    namespace: kupra-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kupra-operator-bind
aggregationRule:
  clusterRoleSelectors:
    - matchLabels:
        kupra.futo.tech/aggregate-to-operator: "true"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kupra-operator-bind-base
  labels:
    kupra.futo.tech/aggregate-to-operator: "true"
rules:
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterroles]
    verbs: [bind]
    resourceNames: [kupra-preview-template, kupra-preview-access]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kupra-operator-bind
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kupra-operator-bind
subjects:
  - kind: ServiceAccount
    name: kupra-operator
    namespace: kupra-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kupra-operator
  namespace: kupra-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kupra-operator
subjects:
  - kind: ServiceAccount
    name: kupra-operator
    namespace: kupra-system
