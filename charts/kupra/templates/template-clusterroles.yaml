apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kupra-preview-template
aggregationRule:
  clusterRoleSelectors:
    - matchLabels:
        kupra.futo.tech/aggregate-to-template: "true"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kupra-preview-template-base
  labels:
    kupra.futo.tech/aggregate-to-template: "true"
rules:
  - apiGroups: [""]
    resources: [configmaps, persistentvolumeclaims, secrets, services]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [apps]
    resources: [deployments, statefulsets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [grpcroutes, httproutes, tcproutes, tlsroutes, udproutes]
    verbs: [get, list, watch, create, update, patch, delete]
