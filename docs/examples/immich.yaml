apiVersion: kupra.futo.tech/v1alpha1
kind: PreviewApp
metadata:
  name: immich
spec:
  parameters:
    - name: tag
      title: Image tag
      description: e.g. commit-<sha>, pr-1234 or v2.1.0
      required: true
      uiHint:
        type: imageTag
        repository: ghcr.io/immich-app/immich-server
    - name: machineLearning
      title: Machine learning
      type: boolean
      default: true

  variables:
    - name: host
      expression: preview.name + ".immich.preview.example.com"

  links:
    - name: Web
      urlExpr: '"https://" + variables.host'

  template:
    resources:
      - apiVersion: postgresql.cnpg.io/v1
        kind: Cluster
        metadata:
          name: database
        spec:
          instances: 1
          imageName: ghcr.io/tensorchord/cloudnative-vectorchord:14.18-0.3.0
          enableSuperuserAccess: true
          postgresql:
            shared_preload_libraries:
              - vchord.so
          storage:
            size: 10Gi

      - apiVersion: v1
        kind: PersistentVolumeClaim
        metadata:
          name: library
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 100Gi

      - apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: valkey
        spec:
          selector:
            matchLabels:
              app.kubernetes.io/name: valkey
          template:
            metadata:
              labels:
                app.kubernetes.io/name: valkey
            spec:
              containers:
                - name: valkey
                  image: docker.io/valkey/valkey:9
                  ports:
                    - name: redis
                      containerPort: 6379
      - apiVersion: v1
        kind: Service
        metadata:
          name: valkey
        spec:
          selector:
            app.kubernetes.io/name: valkey
          ports:
            - name: redis
              port: 6379
              targetPort: redis

      - apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: immich-server
        spec:
          selector:
            matchLabels:
              app.kubernetes.io/name: immich-server
          template:
            metadata:
              labels:
                app.kubernetes.io/name: immich-server
            spec:
              containers:
                - name: server
                  imageExpr: '"ghcr.io/immich-app/immich-server:" + params.tag'
                  env:
                    - name: DB_HOSTNAME
                      valueFrom:
                        secretKeyRef:
                          name: database-superuser
                          key: host
                    - name: DB_USERNAME
                      valueFrom:
                        secretKeyRef:
                          name: database-superuser
                          key: user
                    - name: DB_PASSWORD
                      valueFrom:
                        secretKeyRef:
                          name: database-superuser
                          key: password
                    - name: DB_DATABASE_NAME
                      valueFrom:
                        secretKeyRef:
                          name: database-app
                          key: dbname
                    - name: REDIS_HOSTNAME
                      value: valkey
                  ports:
                    - name: http
                      containerPort: 2283
                  readinessProbe:
                    httpGet:
                      path: /api/server/ping
                      port: http
                  volumeMounts:
                    - name: library
                      mountPath: /data
              volumes:
                - name: library
                  persistentVolumeClaim:
                    claimName: library
      - apiVersion: v1
        kind: Service
        metadata:
          name: immich-server
        spec:
          selector:
            app.kubernetes.io/name: immich-server
          ports:
            - name: http
              port: 2283
              targetPort: http

      - apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: immich-machine-learning
          annotations:
            kupra.futo.tech/include-when: params.machineLearning
        spec:
          selector:
            matchLabels:
              app.kubernetes.io/name: immich-machine-learning
          template:
            metadata:
              labels:
                app.kubernetes.io/name: immich-machine-learning
            spec:
              containers:
                - name: machine-learning
                  imageExpr: '"ghcr.io/immich-app/immich-machine-learning:" + params.tag'
                  ports:
                    - name: http
                      containerPort: 3003
                  volumeMounts:
                    - name: cache
                      mountPath: /cache
              volumes:
                - name: cache
                  emptyDir: {}
      - apiVersion: v1
        kind: Service
        metadata:
          name: immich-machine-learning
          annotations:
            kupra.futo.tech/include-when: params.machineLearning
        spec:
          selector:
            app.kubernetes.io/name: immich-machine-learning
          ports:
            - name: http
              port: 3003
              targetPort: http

      - apiVersion: gateway.networking.k8s.io/v1
        kind: HTTPRoute
        metadata:
          name: web
        spec:
          parentRefs:
            - name: previews
              namespace: gateway-system
          hostnamesExpr: '[variables.host]'
          rules:
            - backendRefs:
                - name: immich-server
                  port: 2283
---
apiVersion: kupra.futo.tech/v1alpha1
kind: Preview
metadata:
  name: pr-1234
spec:
  app: immich
  parameters:
    tag: pr-1234
  restoreFrom:
    snapshot:
      selector:
        matchLabels:
          kupra.futo.tech/channel: base
